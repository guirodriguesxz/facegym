spring:
  application:
    name: facegym-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:facegym}
    username: ${DB_USER:facegym}
    password: ${DB_PASSWORD:facegym}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 11MB  # check-in com prova de vida manda duas fotos

server:
  port: ${PORT:8080}
  # Render fica na frente: o IP real do cliente vem no X-Forwarded-For (usado no limite de tentativas)
  forward-headers-strategy: native

facegym:
  fuso: ${FACEGYM_FUSO:America/Sao_Paulo}
  limiares:
    aceite: ${LIMIAR_ACEITE:0.41}
    duvida: ${LIMIAR_DUVIDA:0.18}
  # CPFs dos alunos fictícios da galeria (só têm foto estática): passam sem prova de vida.
  demo-cpfs: ${FACEGYM_DEMO_CPFS:}
  jwt-secret: ${JWT_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:admin@facegym.dev}
    senha: ${ADMIN_PASSWORD:}
  cors: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  biometria:
    url: ${BIOMETRIA_URL:http://localhost:8000}
    chave: ${BIOMETRIA_KEY:}  # obrigatória, mesma INTERNAL_KEY do serviço de biometria
    timeout: ${BIOMETRIA_TIMEOUT:2s}  # produção (CPU fracionada) usa mais
    janela: 10
    taxa-falha: 50
    espera: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized  # anônimo (Render) vê só UP/DOWN
