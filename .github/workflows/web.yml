name: web
on:
  push:
    paths: ["facegym-web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["facegym-web/**", ".github/workflows/web.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: facegym-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: facegym-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build  # tsc -b + vite build: pega erro de tipo que os testes não pegam
