spring:
  application:
    name: facegym-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:facegym}
    username: ${DB_USER:facegym}
    password: ${DB_PASSWORD:facegym}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 11MB  # duas fotos de até 5 MB (vivacidade)

server:
  port: ${PORT:8080}

facegym:
  fuso: ${FACEGYM_FUSO:America/Sao_Paulo}
  limiares:
    aceite: ${LIMIAR_ACEITE:0.41}
    duvida: ${LIMIAR_DUVIDA:0.18}
  antipassback: ${ANTIPASSBACK:5m}  # 0 desliga
  vivacidade:
    modo: ${VIVACIDADE:obrigatoria}  # opcional: aceita foto única (demo com alunos fictícios)
    frente: ${VIVACIDADE_FRENTE:0.15}
    virada: ${VIVACIDADE_VIRADA:0.25}
    mesma-pessoa: ${VIVACIDADE_MESMA_PESSOA:0.30}
  jwt-secret: ${JWT_SECRET:}
  admin:
    email: ${ADMIN_EMAIL:admin@facegym.dev}
    senha: ${ADMIN_PASSWORD:}
  cors: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  biometria:
    url: ${BIOMETRIA_URL:http://localhost:8000}
    chave: ${BIOMETRIA_KEY:local-dev-key-0123456789}
    timeout: ${BIOMETRIA_TIMEOUT:2s}  # produção (CPU fracionada) usa mais
    janela: 10
    taxa-falha: 50
    espera: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
